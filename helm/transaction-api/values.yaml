replicaCount: 2

image:
  repository: "REPLACE_WITH_ECR_URI"
  pullPolicy: IfNotPresent
  tag: ""  # overridden by --set image.tag=$GIT_SHA

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: "REPLACE_WITH_ACM_ARN"
    alb.ingress.kubernetes.io/wafv2-acl-arn: "REPLACE_WITH_WAF_ACL_ARN"
    external-dns.alpha.kubernetes.io/hostname: "transaction-api.example.com"
  hosts:
    - host: "transaction-api.example.com"
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

pdb:
  minAvailable: 1

serviceAccount:
  create: true
  annotations: {}
  roleArn: "" # Set to Terraform workload_role_arn for direct Secrets Manager access.
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

config:
  dbUrl: "jdbc:postgresql://REPLACE_WITH_RDS_ENDPOINT:5432/transactions"
  paymentProviderBaseUrl: "https://REPLACE_WITH_PROVIDER_URL"
  serverPort: "8080"

secretsManager:
  enabled: true
  region: "us-east-1"
  secretArn: "REPLACE_WITH_SECRETS_MANAGER_ARN"

networkPolicy:
  enabled: true
  # Replace with the application VPC CIDR(s); ALB IP targets connect directly to pods.
  albSourceCidrs: ["10.42.0.0/16"]
  postgresqlPort: 5432
