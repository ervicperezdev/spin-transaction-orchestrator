{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "transaction-api.fullname" . }}
  labels:
    {{- include "transaction-api.labels" . | nindent 4 }}
  annotations:
    external-dns.alpha.kubernetes.io/hostname: {{ required "ingress.hostname must come from Terraform application_hostname output" .Values.ingress.hostname | quote }}
  {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if .Values.ingress.waf.enabled }}
    alb.ingress.kubernetes.io/wafv2-acl-arn: {{ required "ingress.waf.aclArn is required when WAF is enabled" .Values.ingress.waf.aclArn | quote }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    - host: {{ required "ingress.hostname must come from Terraform application_hostname output" .Values.ingress.hostname | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.path }}
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: {{ include "transaction-api.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
{{- end }}
