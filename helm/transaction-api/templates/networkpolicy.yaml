{{- if .Values.networkPolicy.enabled }}
# Default-deny all ingress and egress traffic
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "transaction-api.fullname" . }}-default-deny
  labels:
    {{- include "transaction-api.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "transaction-api.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
---
# In IP target mode the ALB connects directly to pod IPs from its VPC ENIs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "transaction-api.fullname" . }}-allow-ingress
  labels:
    {{- include "transaction-api.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "transaction-api.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- range .Values.networkPolicy.albSourceCidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 8080
---
# Allow egress: DNS (UDP 53), PostgreSQL (TCP 5432), HTTPS (TCP 443), K8s API (TCP 443/6443)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "transaction-api.fullname" . }}-allow-egress
  labels:
    {{- include "transaction-api.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "transaction-api.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    # DNS resolution
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # PostgreSQL
    - ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.postgresqlPort }}
    # HTTPS for payment provider and AWS APIs
    - ports:
        - protocol: TCP
          port: 443
    # Kubernetes API server
    - ports:
        - protocol: TCP
          port: 6443
{{- end }}
