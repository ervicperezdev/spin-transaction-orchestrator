{{- if .Values.paymentProviderMock.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "transaction-api.fullname" . }}-provider-mock
data:
  execute-approved.json: |
    {"request":{"method":"POST","urlPath":"/provider/v1/execute"},"response":{"status":200,"headers":{"Content-Type":"application/json"},"jsonBody":{"status":"APPROVED","transactionId":"mock-transaction","balance":974.50,"executedAt":"2026-01-01T00:00:00Z"}}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "transaction-api.fullname" . }}-provider-mock
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "transaction-api.name" . }}-provider-mock
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "transaction-api.fullname" . }}-provider-mock
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "transaction-api.name" . }}-provider-mock
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "transaction-api.name" . }}-provider-mock
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: wiremock
          image: {{ .Values.paymentProviderMock.image | quote }}
          ports: [{ name: http, containerPort: 8080 }]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: mappings, mountPath: /home/wiremock/mappings, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: mappings
          configMap: { name: {{ include "transaction-api.fullname" . }}-provider-mock }
        - name: tmp
          emptyDir: {}
{{- end }}
