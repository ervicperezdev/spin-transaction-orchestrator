# Valores de desarrollo. Usar con --namespace transaction-api.
# Reemplazar todos los REPLACE_WITH_* antes de desplegar; solo guardar
# identificadores aquí, nunca contraseñas ni el contenido de Secrets Manager.
replicaCount: 1

image:
  repository: "911167887101.dkr.ecr.us-east-1.amazonaws.com/spin-transaction-orchestrator"
  # El pipeline debe proporcionar image.tag con el SHA de la imagen publicada.

autoscaling:
  minReplicas: 1
  maxReplicas: 3

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 250m
    memory: 512Mi

serviceAccount:
  create: true
  name: "transaction-api"
  # Confirmar con terraform output -raw workload_role_arn; no usar el rol CI.
  roleArn: "arn:aws:iam::911167887101:role/spin-dev-transaction-api"

config:
  # Usar el host de terraform output -raw rds_endpoint, sin duplicar el puerto.
  # Terraform crea la base transactions, también para el ambiente dev.
  dbUrl: "jdbc:postgresql://spin-dev.cs1s0e0m6t0w.us-east-1.rds.amazonaws.com:5432/transactions"
  paymentProviderBaseUrl: "http://transaction-api-provider-mock:8080"
  serverPort: "8080"

secretsManager:
  enabled: true
  region: "us-east-1"
  # Autorizar este mismo ARN en workload_secret_arns de Terraform.
  # JSON requerido: db-username, db-password y payment-provider-api-key.
  secretArn: "arn:aws:secretsmanager:us-east-1:911167887101:secret:rds!db-19d34a63-3f5e-46e0-acfa-36988c44abcc-pqzfJX"

ingress:
  enabled: true
  # CI sets this from APP_HOSTNAME, which must equal Terraform's
  # application_hostname output. Do not hard-code a second FQDN here.
  hostname: ""
  path: /
  pathType: Prefix
  annotations:
    # Salidas acm_certificate_arn y alb_security_group_id. WAF está desactivado en dev.
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:us-east-1:911167887101:certificate/27d8dcfd-8292-4f4d-be17-69f19588d9cf"
    alb.ingress.kubernetes.io/security-groups: "sg-0b55406a1036d29ee"
  waf:
    enabled: false
    aclArn: ""

networkPolicy:
  enabled: true
  # Debe coincidir con el CIDR de la VPC desde la que el ALB alcanza los pods.
  albSourceCidrs: ["10.42.0.0/16"]

paymentProviderMock:
  enabled: true
