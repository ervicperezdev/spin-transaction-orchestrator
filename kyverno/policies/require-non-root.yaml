apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-non-root
  annotations:
    policies.kyverno.io/title: Require Non-Root User
    policies.kyverno.io/category: Pod Security Standards / Restricted
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Containers must not run as root. This policy validates that
      runAsNonRoot is set to true at both the pod and container security context.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: require-non-root-pod-level
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Pod securityContext must set runAsNonRoot: true."
        pattern:
          spec:
            securityContext:
              runAsNonRoot: true
    - name: require-non-root-container-level
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "All containers must set securityContext.runAsNonRoot: true."
        foreach:
          - list: "request.object.spec.containers"
            pattern:
              securityContext:
                runAsNonRoot: true
