apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-privilege-escalation
  annotations:
    policies.kyverno.io/title: Disallow Privilege Escalation
    policies.kyverno.io/category: Pod Security Standards / Restricted
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Privilege escalation, such as via set-user-ID or set-group-ID file mode,
      should not be allowed. This policy requires allowPrivilegeEscalation to be
      explicitly set to false on all containers.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: disallow-privilege-escalation
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "All containers must set securityContext.allowPrivilegeEscalation: false."
        foreach:
          - list: "request.object.spec.containers"
            pattern:
              securityContext:
                allowPrivilegeEscalation: false
    - name: disallow-privilege-escalation-init-containers
      match:
        any:
          - resources:
              kinds:
                - Pod
      preconditions:
        any:
          - key: "{{ request.object.spec.initContainers[] | length(@) }}"
            operator: GreaterThanOrEquals
            value: 1
      validate:
        message: "All init containers must set securityContext.allowPrivilegeEscalation: false."
        foreach:
          - list: "request.object.spec.initContainers"
            pattern:
              securityContext:
                allowPrivilegeEscalation: false
