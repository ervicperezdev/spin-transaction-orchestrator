version: 2
updates:
  # Keep Maven dependencies up to date. PRs are capped at 5 open at a time
  # to avoid review fatigue; oldest PRs are closed automatically once the cap
  # is reached and a newer version is available.
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Keep GitHub Actions pinned to their latest patch releases. This prevents
  # supply-chain attacks via mutable action tags (e.g., @v4 pointing to new code).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Keep the base image in Dockerfile updated so security patches in the JRE
  # layer are pulled in automatically rather than waiting for manual bumps.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
