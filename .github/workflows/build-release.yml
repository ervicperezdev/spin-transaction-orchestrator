name: Build & Release

# Triggered on every merge to main. Builds the artifact ONCE, tags it with the
# commit SHA, pushes to ECR, scans it, generates an SBOM, signs it with Cosign
# keyless signing, then promotes the same image to EKS without rebuilding.
#
# AUTH: GitHub OIDC → AWS STS AssumeRoleWithWebIdentity.
#   No static AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY stored in GitHub Secrets.
#   The OIDC token is minted by GitHub per-run and exchanged for short-lived
#   STS credentials that expire when the job ends.

on:
  push:
    branches: [main]

env:
  # ECR registry and image name are resolved at runtime from AWS account metadata
  # and repository variables so no registry URL is hardcoded here.
  IMAGE_NAME: spin-transaction-orchestrator

# id-token: write is required globally so the OIDC token can be minted for
# aws-actions/configure-aws-credentials in both jobs.
permissions:
  contents: read
  id-token: write

jobs:
  # ── BUILD, SCAN, SIGN, PUSH ───────────────────────────────────────────────
  build-and-push:
    name: Build → Scan → Sign → Push
    runs-on: ubuntu-latest

    outputs:
      image-tag: ${{ github.sha }}
      ecr-image: ${{ steps.ecr-login.outputs.registry }}/${{ env.IMAGE_NAME }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Java build ─────────────────────────────────────────────────────────
      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Package (skip tests – tests ran in PR gate)
        run: ./mvnw --batch-mode --no-transfer-progress package -DskipTests

      - name: Debug GitHub OIDC claims
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );

            console.log('iss:', payload.iss);
            console.log('aud:', payload.aud);
            console.log('sub:', payload.sub);
            console.log('repository:', payload.repository);
            console.log('repository_id:', payload.repository_id);
            console.log('repository_owner:', payload.repository_owner);
            console.log('repository_owner_id:', payload.repository_owner_id);
            console.log('ref:', payload.ref);

      # AWS auth via OIDC – no static keys ──────────────────────────────────
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com

      # ECR login ───────────────────────────────────────────────────────────
      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@aded0d722166a37980e030aa969dda0bfe6b6947 # v2.1.7

      # Docker build & push ─────────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and push Docker image
        id: build-push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          # Tag with commit SHA (immutable, traceable) AND latest (mutable pointer).
          # Deployments always reference the SHA tag so rollbacks are deterministic.
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.IMAGE_NAME }}:latest

      # Trivy – container image scan ────────────────────────────────────────
      - name: Scan pushed image for vulnerabilities
        run: |
          ECR_REGISTRY="${{ steps.ecr-login.outputs.registry }}"
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            aquasec/trivy:0.58.1 image \
            --scanners vuln,secret \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --no-progress \
            "${ECR_REGISTRY}/${IMAGE_NAME}:${{ github.sha }}"

      # SBOM – Syft (anchore/sbom-action) ───────────────────────────────────
      # Generates a Software Bill of Materials in SPDX format so downstream
      # teams can audit every library shipped inside the container.
      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@006b7ce8314066bdf1765b4500370d40fa6917a3 # v0.24.2
        with:
          image: ${{ steps.ecr-login.outputs.registry }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          output-file: sbom.spdx.json
          format: spdx-json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ github.sha }}
          path: sbom.spdx.json
          retention-days: 90

      # Cosign keyless signing ───────────────────────────────────────────────
      # Keyless signing uses the GitHub OIDC identity (no signing key to rotate).
      # The signature is stored in the Sigstore transparency log (Rekor) and
      # attached to the image in ECR as an OCI artifact.
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image with keyless OIDC identity
        run: |
          ECR_REGISTRY="${{ steps.ecr-login.outputs.registry }}"
          cosign sign --yes \
            "${ECR_REGISTRY}/${IMAGE_NAME}@${{ steps.build-push.outputs.digest }}"

  # ── DEPLOY TO EKS ────────────────────────────────────────────────────────
  deploy-eks:
    name: Deploy to EKS
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # AWS auth via OIDC – same pattern, separate deploy role if needed ─────
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com

      # kubeconfig ──────────────────────────────────────────────────────────
      - name: Configure kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --name "${{ vars.EKS_CLUSTER_NAME }}" \
            --region "${{ vars.AWS_REGION }}"

      # Helm deploy – promotes the same SHA-tagged image built above ─────────
      - name: Helm upgrade / install
        run: |
          helm upgrade --install transaction-api helm/transaction-api/ \
            --set image.tag="${{ github.sha }}" \
            --namespace transaction-api \
            --create-namespace \
            --wait \
            --timeout 5m

      # Smoke test – verify the health endpoint is reachable after deploy ────
      - name: Smoke test – /actuator/health
        run: |
          curl -f "https://${{ vars.APP_HOSTNAME }}/actuator/health" \
            || echo "Smoke test failed – check deployment logs"
