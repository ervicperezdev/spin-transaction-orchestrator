name: Terraform apply (development)

on:
  push:
    branches: [main]
    paths: ["terraform/**"]

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-development-state
  cancel-in-progress: false

jobs:
  plan:
    name: Plan development (no mutation)
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: "true"
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_REGION: ${{ vars.TF_STATE_REGION }}
      TF_VARS_CONTENT: ${{ secrets.TF_DEV_TFVARS }}
      TF_PLAN_ROLE_ARN: ${{ secrets.AWS_TERRAFORM_PLAN_ROLE_ARN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - name: Check protected plan configuration
        run: |
          missing=()
          for name in AWS_REGION TF_STATE_BUCKET TF_STATE_REGION TF_VARS_CONTENT TF_PLAN_ROLE_ARN; do
            test -n "${!name}" || missing+=("$name")
          done
          if ((${#missing[@]})); then
            echo "::error::Missing Terraform plan configuration: ${missing[*]}."
            exit 1
          fi
      - name: Configure AWS credentials with OIDC plan role
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ env.TF_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com
          retry-max-attempts: 1
      - name: Materialize protected variable file
        working-directory: terraform/environments/dev
        run: |
          umask 077
          printf '%s' "$TF_VARS_CONTENT" > ci.auto.tfvars
      - name: Initialize remote backend
        working-directory: terraform/environments/dev
        run: |
          terraform init -input=false -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="key=spin-transaction-orchestrator/dev/terraform.tfstate" -backend-config="region=$TF_STATE_REGION" -backend-config="encrypt=true" -backend-config="use_lockfile=true"
      - name: Format, validate and security gate
        run: |
          terraform fmt -check -recursive terraform
          terraform -chdir=terraform/environments/dev validate
          pip install checkov --quiet
          checkov -d terraform --quiet
      - name: Generate exact deployment plan
        working-directory: terraform/environments/dev
        run: |
          terraform plan -input=false -no-color -out=tfplan -var-file=ci.auto.tfvars >/dev/null
          git rev-parse HEAD > plan-commit.txt
      - name: Publish non-sensitive plan summary
        working-directory: terraform/environments/dev
        run: |
          terraform show -json tfplan | jq -r '
            .resource_changes // []
            | group_by(.change.actions | join(","))
            | map("- \(length) \(.[0].change.actions | join(", "))")
            | .[]
          ' > "$RUNNER_TEMP/terraform-development-plan-summary.md"
          {
            echo "## Development Terraform plan"
            cat "$RUNNER_TEMP/terraform-development-plan-summary.md"
            echo
            echo "The exact binary plan is retained for the approved apply; attributes and sensitive values are not published."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retain protected binary plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terraform-development-plan-${{ github.sha }}
          path: |
            terraform/environments/dev/tfplan
            terraform/environments/dev/plan-commit.txt
          retention-days: 7
          if-no-files-found: error
      - name: Delete transient variable file
        if: always()
        working-directory: terraform/environments/dev
        run: rm -f ci.auto.tfvars tfplan plan-commit.txt

  apply:
    name: Apply approved development plan
    needs: plan
    runs-on: ubuntu-latest
    environment: development
    env:
      TF_IN_AUTOMATION: "true"
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_REGION: ${{ vars.TF_STATE_REGION }}
      TF_VARS_CONTENT: ${{ secrets.TF_DEV_TFVARS }}
      TF_APPLY_ROLE_ARN: ${{ secrets.AWS_TERRAFORM_APPLY_ROLE_ARN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - name: Check protected apply configuration
        run: |
          missing=()
          for name in AWS_REGION TF_STATE_BUCKET TF_STATE_REGION TF_VARS_CONTENT TF_APPLY_ROLE_ARN; do
            test -n "${!name}" || missing+=("$name")
          done
          if ((${#missing[@]})); then
            echo "::error::Missing Terraform apply configuration: ${missing[*]}."
            exit 1
          fi
      - name: Configure AWS credentials with OIDC apply role
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ env.TF_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com
      - name: Materialize protected variable file
        working-directory: terraform/environments/dev
        run: |
          umask 077
          printf '%s' "$TF_VARS_CONTENT" > ci.auto.tfvars
      - name: Initialize remote backend
        working-directory: terraform/environments/dev
        run: |
          terraform init -input=false -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="key=spin-transaction-orchestrator/dev/terraform.tfstate" -backend-config="region=$TF_STATE_REGION" -backend-config="encrypt=true" -backend-config="use_lockfile=true"
      - name: Download reviewed binary plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v8.0.1
        with:
          name: terraform-development-plan-${{ github.sha }}
          path: terraform/environments/dev
      - name: Verify plan commit
        working-directory: terraform/environments/dev
        run: test "$(git rev-parse HEAD)" = "$(cat plan-commit.txt)"
      - name: Apply exact approved plan
        working-directory: terraform/environments/dev
        run: terraform apply -input=false tfplan
      - name: Deployment record
        if: always()
        run: |
          echo "## Terraform development deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Environment: \`development\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Delete transient material
        if: always()
        working-directory: terraform/environments/dev
        run: rm -f ci.auto.tfvars tfplan plan-commit.txt
