name: Development Delivery

# Build once → Scan → SBOM → Push → Sign → Deploy
#
# Authentication:
# GitHub OIDC → AWS STS AssumeRoleWithWebIdentity.
# No static AWS credentials are stored in GitHub.

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'mvnw'
      - '.mvn/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'helm/**'

env:
  IMAGE_NAME: spin-transaction-orchestrator

permissions:
  contents: read
  id-token: write

concurrency:
  group: development-delivery
  cancel-in-progress: false

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # BUILD → SCAN → SBOM → PUSH → SIGN
  # ──────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build → Scan → SBOM → Push → Sign
    runs-on: ubuntu-latest

    outputs:
      image-tag: ${{ github.sha }}
      ecr-image: ${{ steps.ecr-login.outputs.registry }}/${{ env.IMAGE_NAME }}
      image-digest: ${{ steps.ecr-digest.outputs.digest }}

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ── Java ──────────────────────────────────────────────────────────────
      - name: Set up Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      # Tests already executed in PR validation.
      - name: Package application
        run: |
          ./mvnw \
            --batch-mode \
            --no-transfer-progress \
            package \
            -DskipTests

      # ── AWS OIDC ──────────────────────────────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com

      # Optional but useful for audit/troubleshooting.
      - name: Verify AWS identity
        run: aws sts get-caller-identity

      # ── ECR ───────────────────────────────────────────────────────────────
      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@aded0d722166a37980e030aa969dda0bfe6b6947 # v2.1.7

      # ── Docker ────────────────────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # IMPORTANT:
      # Build exactly once and load the resulting image into the Docker daemon.
      # We intentionally DO NOT push yet.
      - name: Build Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          push: false
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      # ── Trivy Security Gate ───────────────────────────────────────────────
      #
      # Scan the exact local image that will later be pushed.
      # HIGH/CRITICAL vulnerabilities with available fixes block publication.
      #
      - name: Scan image with Trivy
        run: |
          ECR_REGISTRY="${{ steps.ecr-login.outputs.registry }}"
          IMAGE="${ECR_REGISTRY}/${IMAGE_NAME}:${{ github.sha }}"

          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.58.1 \
            image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --no-progress \
            "${IMAGE}"

      # ── SBOM ──────────────────────────────────────────────────────────────
      #
      # Generate the SBOM from the SAME local image that passed Trivy.
      #
      - name: Generate SBOM
        uses: anchore/sbom-action@006b7ce8314066bdf1765b4500370d40fa6917a3 # v0.24.2
        with:
          image: ${{ steps.ecr-login.outputs.registry }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          output-file: sbom.spdx.json
          format: spdx-json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ github.sha }}
          path: sbom.spdx.json
          retention-days: 90

      # Validates the exact local Buildx image before it is published. This is
      # deliberately independent from AWS, DNS, ACM, WAF, ALB and EKS.
      - name: Artifact smoke (image + PostgreSQL)
        env:
          ARTIFACT_IMAGE: ${{ steps.ecr-login.outputs.registry }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: .github/scripts/artifact-smoke.sh

      # ── Push validated artifact ───────────────────────────────────────────
      #
      # Only an image that passed Trivy reaches ECR.
      #
      - name: Push validated image to ECR
        run: |
          ECR_REGISTRY="${{ steps.ecr-login.outputs.registry }}"
          IMAGE="${ECR_REGISTRY}/${IMAGE_NAME}:${{ github.sha }}"

          docker push "${IMAGE}"

      # ── Resolve authoritative ECR digest ──────────────────────────────────
      #
      # IMPORTANT:
      # Do NOT use build-push-action's digest here because the image was loaded
      # locally and pushed later with docker push.
      #
      # ECR is now the source of truth for the digest.
      #
      - name: Resolve image digest from ECR
        id: ecr-digest
        run: |
          DIGEST=$(aws ecr describe-images \
            --repository-name "${IMAGE_NAME}" \
            --image-ids imageTag="${{ github.sha }}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)

          if [[ -z "${DIGEST}" || "${DIGEST}" == "None" ]]; then
            echo "Unable to resolve image digest from ECR"
            exit 1
          fi

          echo "ECR image digest: ${DIGEST}"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      # Extra verification before signing.
      - name: Verify image digest exists in ECR
        run: |
          aws ecr describe-images \
            --repository-name "${IMAGE_NAME}" \
            --image-ids imageDigest="${{ steps.ecr-digest.outputs.digest }}"

      # ── Cosign ────────────────────────────────────────────────────────────
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Sign the digest returned by ECR, not the local Buildx digest.
      - name: Sign image with keyless OIDC identity
        run: |
          ECR_REGISTRY="${{ steps.ecr-login.outputs.registry }}"

          cosign sign --yes \
            "${ECR_REGISTRY}/${IMAGE_NAME}@${{ steps.ecr-digest.outputs.digest }}"

  # ──────────────────────────────────────────────────────────────────────────
  # DEPLOY TO EKS
  # ──────────────────────────────────────────────────────────────────────────
  deploy-eks:
    name: Deploy to development EKS
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ── AWS OIDC ──────────────────────────────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com

      # ── EKS kubeconfig ────────────────────────────────────────────────────
      - name: Verify AWS deployment identity and target cluster
        env:
          EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
        run: |
          aws sts get-caller-identity --query '{Account:Account,Arn:Arn}'
          aws eks describe-cluster \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION" \
            --query 'cluster.{Arn:arn,Status:status,Access:accessConfig}'

      - name: Configure kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --name "${{ vars.EKS_CLUSTER_NAME }}" \
            --region "${{ vars.AWS_REGION }}"

      - name: Verify Helm access to application namespace
        run: |
          if ! helm list --namespace transaction-api; then
            echo '::error::Helm cannot access transaction-api. Compare the AWS identity and cluster above with the Terraform github_deploy access entry and its associated policy.'
            exit 1
          fi

      # ── Helm deployment ───────────────────────────────────────────────────
      #
      # Deploy the exact commit SHA that passed the security gate.
      #
      - name: Helm upgrade / install
        env:
          DEPLOY_HOSTNAME: ${{ vars.APP_HOSTNAME }}
        run: |
          : "${DEPLOY_HOSTNAME:?Set APP_HOSTNAME from Terraform application_hostname output.}"
          helm upgrade --install transaction-api \
            helm/transaction-api/ \
            --values helm/transaction-api/values-dev.yaml \
            --set image.repository="${{ needs.build-and-push.outputs.ecr-image }}" \
            --set image.tag="${{ needs.build-and-push.outputs.image-tag }}" \
            --set-string ingress.hostname="${DEPLOY_HOSTNAME}" \
            --namespace transaction-api \
            --wait \
            --timeout 5m

      # Public development only. Private environments must run this script from
      # a private runner or a minimally privileged in-cluster Job.
      - name: Post-deploy smoke (public development)
        env:
          DEPLOY_HOSTNAME: ${{ vars.APP_HOSTNAME }}
          KUBERNETES_NAMESPACE: transaction-api
          HELM_RELEASE: transaction-api
        run: .github/scripts/post-deploy-smoke.sh
