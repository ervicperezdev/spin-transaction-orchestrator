name: Container security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  hadolint:
    name: Lint Dockerfile
    runs-on: ubuntu-latest
    steps:
      # v4.2.2, verified from https://github.com/actions/checkout/releases/tag/v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Run Hadolint policy
        run: docker run --rm -i hadolint/hadolint:v2.12.0 < Dockerfile

  trivy:
    name: Scan container image
    runs-on: ubuntu-latest
    steps:
      # v4.2.2, verified from https://github.com/actions/checkout/releases/tag/v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build image for scanning
        run: docker build --tag spin-transaction-orchestrator:${{ github.sha }} .
      - name: Export image without registry credentials
        run: docker save --output image.tar spin-transaction-orchestrator:${{ github.sha }}
      - name: Scan vulnerabilities and embedded secrets
        run: >-
          docker run --rm
          --volume "$GITHUB_WORKSPACE:/workspace:ro"
          aquasec/trivy:0.58.1 image
          --input /workspace/image.tar
          --scanners vuln,secret
          --severity HIGH,CRITICAL
          --ignore-unfixed
          --exit-code 1
          --no-progress

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    steps:
      # v4.2.2, verified from https://github.com/actions/checkout/releases/tag/v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Run blocking Semgrep SAST scan
        # 1.99.0 was chosen deliberately and verified available in the official
        # returntocorp/semgrep registry.
        run: >-
          docker run --rm
          --volume "$GITHUB_WORKSPACE:/src:ro"
          --workdir /src
          returntocorp/semgrep:1.99.0
          semgrep --config=auto --error --quiet

  quality-gate:
    name: Quality Gate
    needs: [hadolint, trivy, semgrep]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Enforce required security controls
        env:
          HADOLINT_RESULT: ${{ needs.hadolint.result }}
          TRIVY_RESULT: ${{ needs.trivy.result }}
          SEMGREP_RESULT: ${{ needs.semgrep.result }}
        run: |
          printf 'hadolint: %s\ntrivy: %s\nsemgrep: %s\n' \
            "$HADOLINT_RESULT" "$TRIVY_RESULT" "$SEMGREP_RESULT"
          for result in "$HADOLINT_RESULT" "$TRIVY_RESULT" "$SEMGREP_RESULT"; do
            if [ "$result" != success ]; then
              echo 'ERROR: A required security control did not pass.'
              exit 1
            fi
          done
