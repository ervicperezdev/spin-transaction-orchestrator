services:
  app:
    image: "${ARTIFACT_IMAGE:?ARTIFACT_IMAGE is required}"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/transactions
      DB_USERNAME: transactions_app
      DB_PASSWORD: transactions_app
      # The smoke only reads an empty local database. No provider call is made.
      PAYMENT_PROVIDER_BASE_URL: http://127.0.0.1:9
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:18080:8080"
