services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: transactions
      POSTGRES_USER: transactions_app
      POSTGRES_PASSWORD: transactions_app
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transactions_app -d transactions"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
  payment-provider-mock:
    image: wiremock/wiremock:3.13.2
    ports: ["9090:8080"]
    volumes:
      - ./wiremock/mappings:/home/wiremock/mappings:ro

volumes:
  postgres-data:
