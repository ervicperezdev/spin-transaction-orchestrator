spring:
  application:
    name: spin-transaction-orchestrator
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/transactions}
    username: ${DB_USERNAME:transactions_app}
    password: ${DB_PASSWORD:transactions_app}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  structured:
    format:
      console: logstash

payment-provider:
  base-url: ${PAYMENT_PROVIDER_BASE_URL:http://localhost:9090}
  connect-timeout: ${PAYMENT_PROVIDER_CONNECT_TIMEOUT:2s}
  read-timeout: ${PAYMENT_PROVIDER_READ_TIMEOUT:3s}
